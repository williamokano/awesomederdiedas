name: Build and Publish

# Builds a release tag and publishes it:
#   - signed bundle (.aab) uploaded to Google Play
#   - signed APK attached to the GitHub Release for sideloading
# Normally called by the "Create Release" workflow. Run it manually with an
# existing tag to retry a publish that failed.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.2.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, e.g. v1.2.0'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest -PappVersionName=${{ steps.version.outputs.name }}

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed bundle and APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PappVersionName=${{ steps.version.outputs.name }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Rename outputs
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/derdiedas-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/derdiedas-${{ steps.version.outputs.name }}.apk"
          # R8 mapping for the APK. Play gets its own copy from inside the .aab,
          # but sideloaded crashes can only be read with this file.
          cp app/build/outputs/mapping/release/mapping.txt "dist/derdiedas-${{ steps.version.outputs.name }}-mapping.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: dist/

  play:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: okano.dev.android.derdiedas
          releaseFiles: dist/derdiedas-${{ needs.build.outputs.version }}.aab
          # Set the PLAY_TRACK repository variable (internal, alpha or beta) to release to a testing track instead
          tracks: ${{ vars.PLAY_TRACK || 'production' }}
          status: completed

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: dist/derdiedas-${{ needs.build.outputs.version }}.apk
          MAPPING: dist/derdiedas-${{ needs.build.outputs.version }}-mapping.txt
        run: |
          # "Create Release" already made the release with the changelog; create it only if missing
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Der Die Das ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" "$APK" "$MAPPING" --repo "$GITHUB_REPOSITORY" --clobber
