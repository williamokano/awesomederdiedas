name: Release

# Push a tag like v1.0.4 to:
#   - build a signed bundle (.aab) and upload it to Google Play
#   - build a signed APK and publish it on the GitHub Release for sideloading
on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest -PappVersionName=${{ steps.version.outputs.name }}

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed bundle and APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PappVersionName=${{ steps.version.outputs.name }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Rename outputs
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/derdiedas-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/derdiedas-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.name }}
          path: dist/

  play:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: okano.dev.android.derdiedas
          releaseFiles: dist/derdiedas-${{ needs.build.outputs.version }}.aab
          # Set the PLAY_TRACK repository variable to alpha, beta or production to change this
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish APK on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Der Die Das ${{ needs.build.outputs.version }}" \
            --generate-notes \
            "dist/derdiedas-${{ needs.build.outputs.version }}.apk"
