# git-cliff configuration: builds CHANGELOG.md and computes the next version
# from Conventional Commits (https://www.conventionalcommits.org).
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = '''
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
'''
footer = ""
trim = false

[git]
conventional_commits = true
# Keep commits made before Conventional Commits were adopted, under "Other"
filter_unconventional = false
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = '<!-- 0 -->Features' },
  { message = '^fix', group = '<!-- 1 -->Bug Fixes' },
  { message = '^perf', group = '<!-- 2 -->Performance' },
  { message = '^refactor', group = '<!-- 3 -->Refactoring' },
  { message = '^docs', group = '<!-- 4 -->Documentation' },
  { message = '^test', group = '<!-- 5 -->Tests' },
  { message = '^(build|ci)', group = '<!-- 6 -->Build and CI' },
  { message = '^(chore|style)', group = '<!-- 7 -->Chores' },
  { message = '.*', group = '<!-- 8 -->Other' },
]
protect_breaking_commits = true
tag_pattern = 'v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"

[bump]
# feat -> minor, BREAKING CHANGE or "!" -> major, anything else -> patch
features_always_bump_minor = true
breaking_always_bump_major = true
